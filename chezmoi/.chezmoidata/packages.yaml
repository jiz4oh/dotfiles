packages:
  darwin:
    taps:
      - localsend/localsend
      - steipete/tap
      - universal-ctags/universal-ctags
      - wxtsky/tap
    brews:
      - name: bash-completion
      - name: git
      - name: gnupg
      - name: httpie
        group: devTools
      - name: mise
      - name: pinentry-mac
      - name: mysql
        group: localServices
      - name: pandoc
        group: devTools
      - name: postgresql@14
        group: localServices
      - name: pre-commit
        group: devTools
      - name: ranger
      - name: redis
        group: localServices
      - name: scrcpy
        group: desktopApps
      - name: tmux
      - name: translate-shell
      - name: tree
      - name: tree-sitter-cli
        group: devTools
      - name: universal-ctags
        group: devTools
        head: true
      - name: wget
      - name: zsh
    casks:
      - 1password
      - 1password-cli
      - android-platform-tools
      - font-hack-nerd-font
      - hammerspoon
      - imageoptim
      - keka
      - keycastr
      - kitty
      - localsend
      - middleclick
      - notunes
      - obsidian
      - onedrive
      - openmtp
      - orbstack
      - qlcolorcode
      - qlmarkdown
      - qlstephen
      - quicklook-video
      - quicklookase
      - raycast
      - snipaste
      - squirrel-app
      - telegram
      - ticktick
      - kap
    services:
      - mysql
      - postgresql@14
  linux:
    apt:
      common:
        - sudo
        - zsh
        - curl
        - wget
        - git
        - python-is-python3
        - pre-commit
        - neovim
        - kitty-terminfo
      debian:
        - universal-ctags
    arch:
      - sudo
      - zsh
      - curl
      - wget
      - git
      - python
      - pre-commit
      - neovim
      - kitty-terminfo
      - ctags
    yum:
      common:
        - sudo
        - zsh
        - curl
        - wget
        - git
        - neovim
