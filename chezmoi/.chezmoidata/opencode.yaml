opencode:
  managed:
    default_agent: build
    small_model: opencode/deepseek-v4.1-flash-free

    tool_output:
      max_lines: 400
      max_bytes: 12288

    # Native auto-compaction: trigger at (model input/context limit - buffer).
    # Absolute buffer so it works whether magpie advertises sol as 500k or 272k:
    # 500k -> 380k, 272k -> 152k, 300k -> 180k, 922k -> 802k.
    compaction:
      auto: true
      buffer: 120000

    # Send prompt_cache_key = opencode session id on magpie requests (opencode's
    # supported provider option; off by default for openai-compatible providers).
    provider:
      magpie:
        options:
          setCacheKey: true

    disabled_providers:
      - openrouter

    # The official ponytail plugin (plugins.toml) injects the ruleset every turn;
    # hide its `ponytail` skill from agents so they don't load the same rules again.
    permissions:
      - action: skill
        resource: ponytail
        effect: deny

    agent:
      plan:
        disable: true
      general:
        disable: true

    mcp:
      servers:
        reqable:
          type: local
          command:
            - /Applications/Reqable.app/Contents/Helpers/mcp-server

    providers:
      openai:
        settings:
          baseURL: http://qnap.ts.jiz4oh.com:8317/v1
