opencode:
  managed:
    default_agent: build
    small_model: magpie/auto/gpt-6-luna

    # Replaces the whole list on merge: keep every instruction file here.
    instructions:
      - ~/.config/opencode/memory-routing.md
      - ~/.config/opencode/context-budget.md

    tool_output:
      max_lines: 400
      max_bytes: 12288

    # Native auto-compaction: trigger at (model limit.input || limit.context) - buffer.
    # Global only in 2.1.2 (no per-agent/per-model key). Use (almost) the full window:
    # 272k -> 240k, 300k -> 268k, 922k -> 890k. The 32k margin covers one step's
    # context growth (p99 ~16k measured 10-22..10-25, tool output capped at 12KB)
    # plus the compaction call's own prompt and summary output. Context overflow
    # still falls back to opencode's overflow compaction.
    # Models with window <= buffer would compact every turn.
    compaction:
      auto: true
      buffer: 32000

    # Send prompt_cache_key = opencode session id on magpie requests (opencode's
    # supported provider option; off by default for openai-compatible providers).
    provider:
      magpie:
        options:
          setCacheKey: true

    disabled_providers:
      - openrouter

    # The official ponytail plugin (plugins.toml) injects the ruleset every turn;
    # hide its `ponytail` skill from agents so they don't load the same rules again.
    permissions:
      - action: skill
        resource: ponytail
        effect: deny

      # Common read-only shell — no approval. Keep patterns narrow; last/first
      # match depends on OpenCode ruleset order, so list specific allows only
      # (global shell default stays ask via client / remaining rules).
      - { action: shell, resource: pwd, effect: allow }
      - { action: shell, resource: "pwd *", effect: allow }
      - { action: shell, resource: whoami, effect: allow }
      - { action: shell, resource: hostname, effect: allow }
      - { action: shell, resource: uname, effect: allow }
      - { action: shell, resource: "uname *", effect: allow }
      - { action: shell, resource: date, effect: allow }
      - { action: shell, resource: "date *", effect: allow }
      - { action: shell, resource: which, effect: allow }
      - { action: shell, resource: "which *", effect: allow }
      - { action: shell, resource: "command -v *", effect: allow }
      - { action: shell, resource: ls, effect: allow }
      - { action: shell, resource: "ls *", effect: allow }
      - { action: shell, resource: "tree *", effect: allow }
      - { action: shell, resource: "fd *", effect: allow }
      - { action: shell, resource: "rg *", effect: allow }
      - { action: shell, resource: "grep *", effect: allow }
      - { action: shell, resource: "cat *", effect: allow }
      - { action: shell, resource: "head *", effect: allow }
      - { action: shell, resource: "tail *", effect: allow }
      - { action: shell, resource: "wc *", effect: allow }
      - { action: shell, resource: "file *", effect: allow }
      - { action: shell, resource: "stat *", effect: allow }
      - { action: shell, resource: "jq *", effect: allow }
      - { action: shell, resource: "yq *", effect: allow }
      - { action: shell, resource: "bat *", effect: allow }
      - { action: shell, resource: "git status", effect: allow }
      - { action: shell, resource: "git status *", effect: allow }
      - { action: shell, resource: "git diff", effect: allow }
      - { action: shell, resource: "git diff *", effect: allow }
      - { action: shell, resource: "git log", effect: allow }
      - { action: shell, resource: "git log *", effect: allow }
      - { action: shell, resource: "git show", effect: allow }
      - { action: shell, resource: "git show *", effect: allow }
      - { action: shell, resource: "git branch", effect: allow }
      - { action: shell, resource: "git branch *", effect: allow }
      - { action: shell, resource: "git rev-parse *", effect: allow }
      - { action: shell, resource: "git describe *", effect: allow }
      - { action: shell, resource: "git remote -v", effect: allow }
      - { action: shell, resource: "git remote -v *", effect: allow }
      - { action: shell, resource: "git blame *", effect: allow }
      - { action: shell, resource: "git stash list", effect: allow }
      - { action: shell, resource: "git stash list *", effect: allow }
      - { action: shell, resource: "git tag", effect: allow }
      - { action: shell, resource: "git tag -l *", effect: allow }
      # rtk rewrite (OpenCode evaluates the rewritten command)
      - { action: shell, resource: "rtk pwd", effect: allow }
      - { action: shell, resource: "rtk pwd *", effect: allow }
      - { action: shell, resource: "rtk ls", effect: allow }
      - { action: shell, resource: "rtk ls *", effect: allow }
      - { action: shell, resource: "rtk rg *", effect: allow }
      - { action: shell, resource: "rtk git status", effect: allow }
      - { action: shell, resource: "rtk git status *", effect: allow }
      - { action: shell, resource: "rtk git diff", effect: allow }
      - { action: shell, resource: "rtk git diff *", effect: allow }
      - { action: shell, resource: "rtk git log", effect: allow }
      - { action: shell, resource: "rtk git log *", effect: allow }
      - { action: shell, resource: "rtk git show", effect: allow }
      - { action: shell, resource: "rtk git show *", effect: allow }
      - { action: shell, resource: "rtk git branch", effect: allow }
      - { action: shell, resource: "rtk git branch *", effect: allow }
      - { action: shell, resource: "rtk git rev-parse *", effect: allow }

      # Project dependency installs — no approval (mise-wrapped too)
      - { action: shell, resource: "bundle install", effect: allow }
      - { action: shell, resource: "bundle install *", effect: allow }
      - { action: shell, resource: "bundle update", effect: allow }
      - { action: shell, resource: "bundle update *", effect: allow }
      - { action: shell, resource: "mise exec -- bundle install", effect: allow }
      - { action: shell, resource: "mise exec -- bundle install *", effect: allow }
      - { action: shell, resource: "mise exec -- bundle update", effect: allow }
      - { action: shell, resource: "mise exec -- bundle update *", effect: allow }
      - { action: shell, resource: "npm install", effect: allow }
      - { action: shell, resource: "npm install *", effect: allow }
      - { action: shell, resource: "npm ci", effect: allow }
      - { action: shell, resource: "npm ci *", effect: allow }
      - { action: shell, resource: "pnpm install", effect: allow }
      - { action: shell, resource: "pnpm install *", effect: allow }
      - { action: shell, resource: "pnpm i", effect: allow }
      - { action: shell, resource: "pnpm i *", effect: allow }
      - { action: shell, resource: "yarn install", effect: allow }
      - { action: shell, resource: "yarn install *", effect: allow }
      - { action: shell, resource: "bun install", effect: allow }
      - { action: shell, resource: "bun install *", effect: allow }
      - { action: shell, resource: "pip install *", effect: allow }
      - { action: shell, resource: "pip3 install *", effect: allow }
      - { action: shell, resource: "uv sync", effect: allow }
      - { action: shell, resource: "uv sync *", effect: allow }
      - { action: shell, resource: "uv pip install *", effect: allow }
      - { action: shell, resource: "cargo build", effect: allow }
      - { action: shell, resource: "cargo build *", effect: allow }
      - { action: shell, resource: "cargo fetch", effect: allow }
      - { action: shell, resource: "cargo fetch *", effect: allow }
      - { action: shell, resource: "go mod download", effect: allow }
      - { action: shell, resource: "go mod download *", effect: allow }
      - { action: shell, resource: "go mod tidy", effect: allow }
      - { action: shell, resource: "go mod tidy *", effect: allow }
      - { action: shell, resource: "mise install", effect: allow }
      - { action: shell, resource: "mise install *", effect: allow }

      # Destructive — hard deny (never Jev / never ask)
      - { action: shell, resource: "sudo *", effect: deny }
      - { action: shell, resource: "su *", effect: deny }
      - { action: shell, resource: "rm -rf *", effect: deny }
      - { action: shell, resource: "rm -fr *", effect: deny }
      - { action: shell, resource: "git push", effect: deny }
      - { action: shell, resource: "git push *", effect: deny }
      - { action: shell, resource: "git reset --hard *", effect: deny }
      - { action: shell, resource: "git clean -fd *", effect: deny }
      - { action: shell, resource: "mkfs *", effect: deny }
      - { action: shell, resource: "dd *", effect: deny }

      # Outside-worktree reads (opencode external_directory gate)
      - { action: external_directory, resource: "~/.local/share/mise/**", effect: allow }
      - { action: external_directory, resource: "~/.local/share/mise/*", effect: allow }
      - { action: external_directory, resource: "/Users/jiz4oh/.local/share/mise/**", effect: allow }
      - { action: external_directory, resource: "/Users/jiz4oh/.local/share/mise/*", effect: allow }
      - { action: external_directory, resource: "~/.agents/skills/**", effect: allow }
      - { action: external_directory, resource: "~/.agents/skills/*", effect: allow }
      - { action: external_directory, resource: "/Users/jiz4oh/.agents/skills/**", effect: allow }
      - { action: external_directory, resource: "/Users/jiz4oh/.agents/skills/*", effect: allow }
      - { action: external_directory, resource: "~/go/pkg/mod/**", effect: allow }
      - { action: external_directory, resource: "/Users/jiz4oh/go/pkg/mod/**", effect: allow }

    agent:
      plan:
        disable: true
      general:
        disable: true

    mcp:
      servers:
        openviking:
          type: remote
          url: http://qnap.ts.jiz4oh.com:1933/mcp
          oauth: false
          codemode: false
          headers:
            Authorization: "Bearer {file:/Users/jiz4oh/.openviking/mcp_api_key}"
          timeout:
            startup: 15000
            catalog: 15000
            execution: 15000

    providers:
      openai:
        settings:
          baseURL: http://qnap.ts.jiz4oh.com:8317/v1
